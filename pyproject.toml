[project]
name = "nonebot-plugin-doubao-draw"
version = "0.1.6"
description = "豆包AI绘图插件，支持文生图和以图生图"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "nonebot2>=2.0.0",
    "nonebot-adapter-onebot>=2.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nwasvsad/nonebot-plugin-doubao-draw"
Repository = "https://github.com/nwasvsad/nonebot-plugin-doubao-draw"

[project.entry-points."nonebot.plugins"]
"nonebot-plugin-doubao-draw" = "nonebot_plugin_doubao_draw"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.nonebot]
plugins = ["nonebot_plugin_doubao_draw"]
supported_adapters = ["~onebot.v11"]
